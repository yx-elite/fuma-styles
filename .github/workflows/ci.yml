name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Everything a change must pass before it is merged: unit tests, type check,
    # the static export of the playground and the starter, and what npm would publish
    name: Build and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Check out the code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run the unit tests
        run: npm test

      - name: Type-check the package, playground, and starter
        run: npm run typecheck

      - name: Build the static sites
        run: npm run build

      - name: Show what would be published to npm
        run: npm pack --dry-run -w @yx-elite/notestack -w create-notestack

  create-site:
    # What a new user gets: `npm create notestack` from the packed command,
    # the packed theme installed outside this repo, and a static export of the new site
    name: Create a site from the packed packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pack both packages
        run: |
          npm run build -w @yx-elite/notestack
          npm pack -w @yx-elite/notestack -w create-notestack --pack-destination "$RUNNER_TEMP"

      - name: Create a site with the packed command
        working-directory: ${{ runner.temp }}
        run: |
          command=$(echo create-notestack-*.tgz)
          npm exec --yes --package="./$command" -- create-notestack ci-notes --no-install

      - name: Install the packed theme into the site
        working-directory: ${{ runner.temp }}/ci-notes
        run: npm install ../yx-elite-notestack-*.tgz

      - name: Build the site
        working-directory: ${{ runner.temp }}/ci-notes
        run: |
          npm run build
          test -f out/index.html
          test -f out/docs/index.html
